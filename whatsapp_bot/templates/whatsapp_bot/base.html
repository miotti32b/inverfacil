{% extends "calculadora/base.html" %}
{% block title %}WhatsApp · InvertirEsFácil{% endblock %}
{% block content %}
<style>
  .wa-wrap { max-width: 900px; margin: 0 auto; padding: 16px; font-family: inherit; }
  .wa-list { list-style: none; padding: 0; margin: 0; border: 1px solid #e2e2e2; border-radius: 8px; overflow: hidden; }
  .wa-list li { border-bottom: 1px solid #eee; }
  .wa-list li:last-child { border-bottom: none; }
  .wa-list a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; }
  .wa-list a:hover { background: #f7f7f7; }
  .wa-badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eee; }
  .wa-badge.nuevo { background: #dbeafe; }
  .wa-badge.interesado { background: #fef3c7; }
  .wa-badge.cliente { background: #dcfce7; }
  .wa-badge.descartado { background: #fee2e2; }
  .wa-thread { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
  .wa-bubble { max-width: 70%; padding: 8px 12px; border-radius: 12px; line-height: 1.35; }
  .wa-bubble.in { align-self: flex-start; background: #f1f1f1; }
  .wa-bubble.out { align-self: flex-end; background: #dcf8c6; }
  .wa-bubble .meta { display: block; font-size: 11px; color: #666; margin-top: 4px; }
  .wa-send { display: flex; gap: 8px; margin-top: 12px; }
  .wa-send input[type=text] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  .wa-send button { padding: 8px 16px; border: none; border-radius: 6px; background: #25D366; color: white; cursor: pointer; }
  .wa-back { display: inline-block; margin-bottom: 12px; color: #333; }
</style>
<div class="wa-wrap">
  {% block wa_content %}{% endblock %}
</div>
{% endblock %}
