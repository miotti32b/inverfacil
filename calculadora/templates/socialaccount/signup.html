{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciando sesión · InvertirEsFácil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #0a0f1e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      color: #f1f5f9;
    }
    .box {
      text-align: center;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: #22c55e;
      margin-bottom: 1.5rem;
      letter-spacing: -0.5px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(34,197,94,0.2);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #64748b; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">IEF</div>
    <div class="spinner"></div>
    <p>Ingresando con Google…</p>
  </div>

  {# Auto-submit silencioso: el usuario nunca ve este formulario #}
  <form id="signup-form" method="post" action="{% url 'socialaccount_signup' %}" style="display:none">
    {% csrf_token %}
    {{ form.as_p }}
    {{ redirect_field }}
  </form>

  <script>
    document.getElementById('signup-form').submit();
  </script>
</body>
</html>
