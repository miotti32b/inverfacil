<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido al Quiz Financiero Diario</title>
    <style>
        body {
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(0,0,0,0.5); 
            padding: 30px; 
            border-radius: 15px;
            max-width: 400px;
        }
        h1 {
            font-size: 28px; 
            margin-bottom: 20px;
        }
        p {
            font-size: 18px; 
            margin-bottom: 30px;
        }
        .btn {
            display: block; 
            width: 100%; 
            margin: 10px 0; 
            padding: 15px; 
            font-size: 18px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .guest {
            background: #444; 
            color: #0ff; 
            border: 2px solid #0ff;
        }
        .login {
            background: #00c6ff; 
            color: white; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Bienvenido al Quiz Financiero Diario!</h1>
        <p>Aprendé finanzas, subí en el ranking y divertite todos los días.</p>
        <button class="btn guest" onclick="window.location.href='/quiz/'">🪐 Jugar como Invitado</button>
        <button class="btn login" onclick="window.location.href='/accounts/login/'">🚀 Jugar y Competir</button>
    </div>
</body>
</html>
