<!-- Mercado Pago render -->
<script type="text/javascript">
(function() {
function $MPC_load() {
window.$MPC_loaded !== true && (function() {
var s = document.createElement('script');
s.type = 'text/javascript'; s.async = true;
s.src = document.location.protocol + '//secure.mlstatic.com/mptools/render.js';
var x = document.getElementsByTagName('script')[0];
x.parentNode.insertBefore(s, x);
window.$MPC_loaded = true;
})();
}
window.$MPC_loaded !== true ? (window.attachEvent ? window.attachEvent('onload', $MPC_load) : window.addEventListener('load', $MPC_load, false)) : null;
})();
</script>


<!-- Carousel logic (mobile) -->
<script>
(function(){
const mq = window.matchMedia('(max-width: 900px)');
const track = document.getElementById('carousel');
const cards = Array.from(track.querySelectorAll('.plan'));
const dots = document.getElementById('dots');


function buildDots(){
dots.innerHTML = '';
cards.forEach((_,i)=>{
const d = document.createElement('button');
d.className = 'dot' + (i===1?' active':''); // inicia en Estrategia
d.dataset.index = i;
d.setAttribute('aria-label','Ir al plan ' + (i+1));
d.addEventListener('click', ()=> scrollToIndex(i));
dots.appendChild(d);
});
}
function centerize(){
if(!mq.matches){ cards.forEach(c=>c.classList.remove('is-center','is-left','is-right')); return; }
const rect = track.getBoundingClientRect();
const mid = rect.left + rect.width/2; let active=0;
cards.forEach((card,i)=>{
const cr = card.getBoundingClientRect(); const cardMid = cr.left + cr.width/2; const diff = cardMid - mid;
const side = diff<-20?'is-left':(diff>20?'is-right':'is-center');
card.classList.remove('is-center','is-left','is-right'); card.classList.add(side);
if(Math.abs(diff) < Math.abs(cards[active].getBoundingClientRect().left + cards[active].getBoundingClientRect().width/2 - mid)) active=i;
});
Array.from(dots.children).forEach((d,idx)=> d.classList.toggle('active', idx===active));
}
function scrollToIndex(i){ const card = cards[i]; const left = card.offsetLeft - (track.clientWidth - card.clientWidth)/2; track.scrollTo({left, behavior:'smooth'}); }


// iniciar en Estrategia en mobile
function startAtMiddle(){ if(!mq.matches) return; scrollToIndex(1); }


if(mq.matches){ buildDots(); startAtMiddle(); centerize(); }
mq.addEventListener('change', e=>{ if(e.matches){ buildDots(); startAtMiddle(); centerize(); } else { dots.innerHTML=''; }});
track.addEventListener('scroll', ()=>{ window.requestAnimationFrame(centerize); });
window.addEventListener('resize', ()=>{ if(mq.matches) centerize(); });
})();
</script>
</body>
</html>
