{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio del Juego</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/start.css' %}">
</head>
<body>
    <div class="container">
        <h2>Bienvenido al Juego Financiero</h2>
        <p>Introduce tus datos para comenzar:</p>
        
        <form id="start-form">
            <label for="username">Nombre:</label>
            <input type="text" name="username" required>

            <label for="age">Edad:</label>
            <input type="number" name="age" required>

            <label for="gender">Género:</label>
            <select name="gender">
                <option value="Hombre">Hombre</option>
                <option value="Mujer">Mujer</option>
                <option value="Otro">Otro</option>
            </select>

            <button type="submit">Jugar</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelector("#start-form").addEventListener("submit", function (event) {
                event.preventDefault(); // Evitamos el envío automático

                fetch("/juego/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCSRFToken()
                    },
                    body: JSON.stringify({
                        username: document.querySelector("input[name='username']").value,
                        age: document.querySelector("input[name='age']").value,
                        gender: document.querySelector("select[name='gender']").value
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        sessionStorage.setItem("player_id", data.player_id); // Guardamos player_id en sessionStorage
                        window.location.href = "/juego/game/"; // Redirige al juego
                    } else {
                        alert("Error al iniciar el juego.");
                    }
                });
            });
        });

        function getCSRFToken() {
            return document.cookie.split("; ")
                .find(row => row.startsWith("csrftoken="))
                ?.split("=")[1];
        }
    </script>
</body>
</html>
