{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio del Juego</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/start.css' %}">
</head>
<body>
    <div class="container">
        <h2>Bienvenidos al Juego Financiero</h2>
        <p>Introduce tus datos para comenzar:</p>
        
        <form id="start-form">
            {% csrf_token %} <!-- 🔥 Esto va dentro del form -->
            
            <label for="username"></label>
            <input type="text" name="username" required placeholder="Nombre">

            <label for="job"></label>
            <input type="text" name="job" placeholder="Profesion" required>

            <label for="age"></label>
            <input type="number" name="age" placeholder="Edad" required>

            <label for="gender"></label>
            <select name="gender">
                <option value="Otro">LGBTIQ+</option>
                <option value="Hombre">Mujer</option>
                <option value="Mujer">Hombre</option>                
            </select>

            <button type="submit">Jugar</button>
        </form>

        <script>
            document.getElementById("start-form").addEventListener("submit", function(event) {
                event.preventDefault(); // Evita que el formulario se envíe automáticamente

                const csrftoken = document.querySelector("[name=csrfmiddlewaretoken]").value;

                fetch("/juego/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrftoken
                    },
                    body: JSON.stringify({
                        username: document.querySelector("input[name='username']").value,
                        age: document.querySelector("input[name='age']").value,
                        gender: document.querySelector("select[name='gender']").value
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        sessionStorage.setItem("player_id", data.player_id);
                        window.location.href = "/juego/instrucciones/";
                    } else {
                        alert("Error al iniciar el juego.");
                    }
                })
                .catch(error => {
                    console.error("Error en la solicitud:", error);
                    alert("Error al conectar con el servidor.");
                });
            });
        </script>
    </div>
</body>
</html>
