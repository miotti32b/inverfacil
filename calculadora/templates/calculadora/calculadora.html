<!-- calculadora/templates/calculadora/calculadora.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Interés Compuesto</title>
    <script src="https://cdn.plot.ly/plotly-2.20.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/calculadora.css' %}">
</head>
<body>
    <div class="container">
        <div class="formulario-container">
            <h1 class="titulo">Calculadora de Interés Compuesto</h1>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="principal">Inversión inicial:</label>
                    <input type="number" class="form-control" id="principal" name="principal" value="{{ principal|default:'' }}" required>
                </div>
                <div class="form-row">
                    <div class="losinputs">
                        <label for="additional_investment">Aportes periódicos:</label>
                        <input type="number" class="cajainputs" id="additional_investment" name="additional_investment" value="{{ additional_investment|default:'' }}" required>
                    </div>
                    <div class="losselects">
                        <label for="investment_period">Frecuencia:</label>
                        <select class="cajaselects" id="investment_period" name="investment_period">
                            <option value="daily" {% if investment_period == 'daily' %}selected{% endif %}>Diaria</option>
                            <option value="weekly" {% if investment_period == 'weekly' %}selected{% endif %}>Semanal</option>
                            <option value="monthly" {% if investment_period == 'monthly' %}selected{% endif %}>Mensual</option>
                            <option value="yearly" {% if investment_period == 'yearly' %}selected{% endif %}>Anual</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="losinputs">
                        <label for="time">Duración:</label>
                        <input type="number" class="cajainputs" id="time" name="time" value="{{ time|default:'' }}" required>
                    </div>
                    <div class="losselects">
                        <label for="time_period">Unidad:</label>
                        <select class="cajaselects" id="time_period" name="time_period">
                            <option value="daily" {% if time_period == 'daily' %}selected{% endif %}>Días</option>
                            <option value="weekly" {% if time_period == 'weekly' %}selected{% endif %}>Semanas</option>
                            <option value="monthly" {% if time_period == 'monthly' %}selected{% endif %}>Meses</option>
                            <option value="yearly" {% if time_period == 'yearly' %}selected{% endif %}>Años</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="losinputs">
                        <label for="rate">Tasa de interés (%):</label>
                        <input type="number" class="cajainputs" id="rate" name="rate" step="0.01" value="{{ rate|default:'' }}" required>
                    </div>
                    <div class="losselects">
                        <label for="rate_period">Frecuencia:</label>
                        <select class="cajaselects" id="rate_period" name="rate_period">
                            <option value="daily" {% if rate_period == 'daily' %}selected{% endif %}>Diaria</option>
                            <option value="weekly" {% if rate_period == 'weekly' %}selected{% endif %}>Semanal</option>
                            <option value="monthly" {% if rate_period == 'monthly' %}selected{% endif %}>Mensual</option>
                            <option value="yearly" {% if rate_period == 'yearly' %}selected{% endif %}>Anual</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Calcular</button>
            </form>
        </div>
        <div class="grafico-container">
            <h1 class="titulo2">Resultado</h1>
            <div id="grafico-container"></div>
        </div>
    </div>

    <script>
        let periods = JSON.parse('{{ periods|default:"[]"|escapejs }}');
        let contributions = JSON.parse('{{ contributions|default:"[]"|escapejs }}');
        let interests = JSON.parse('{{ interests|default:"[]"|escapejs }}');
        let isMobile = window.innerWidth <= 800;
        Plotly.newPlot("grafico-container", [
    {
        x: periods,
        y: contributions,
        type: "bar",
        name: "Monto Aportado",
        marker: { color: "darkgray" },
        text: contributions.map(value => `$${value}`),
        textposition: "inside",
        hoverinfo: "none" // 🔹 Quita el tooltip de las barras de aportes
    },
    {
        x: periods,
        y: interests,
        type: "bar",
        name: "Intereses Generados",
        marker: { color: "#000737" },
        base: contributions,
        text: interests.map(value => `$${value}`), // Monto dentro de la barra
        textposition: "inside",
        hoverinfo: "none" // 🔹 Quita el tooltip de las barras de aportes
    },
    {
        x: periods,
        y: interests,
        type: "scatter",
        mode: "text",
        text: interests.map((value, index) => isMobile ? "" : `<b style="color:green">${((value / (contributions[index] + value)) * 100).toFixed(2)}%<br>Rendimiento</b>`),
        textposition: "botom center",
        showlegend: false,
        hoverinfo: "none" // 🔹 Quita el tooltip de las barras de aportes
    }
], {
    barmode: "stack",
    margin: { t: 20, b: 30, l: 40, r: 10 },  // Ajustes de margen
    xaxis: { showticklabels: false },  // Ocultar etiquetas de períodos
    yaxis: { showticklabels: true },
    legend: { orientation: "h", x: 0.5, xanchor: "center", y: -0.05 },
}, { displayModeBar: false });




    </script>
</body>
</html>
