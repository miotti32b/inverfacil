{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado de Carrera de la Rata</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container text-center mt-5">
        <h1>Resultado de Carrera de la Rata</h1>
        <h3 class="mb-4">Tu puntaje final es: {{ carrera_rata.puntaje_final|default:"0" }}%</h3>
    </div>
    
    <div class="chart-container" style="width: 50%; max-width: 400px; margin: auto;">
        <canvas id="carreraRataChart"></canvas>
    </div>

    <!-- 1. PRIMERO cargamos la librería -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 2. DESPUÉS ejecutamos nuestro código -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Valor por defecto en "0" para evitar errores de sintaxis en JS si no hay datos
            const puntaje = parseFloat("{{ carrera_rata.puntaje_final|default:'0' }}"); 
        
            const ctx = document.getElementById('carreraRataChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [puntaje, 100 - puntaje], 
                        backgroundColor: [
                            puntaje <= 33 ? '#ff4d4d' : puntaje <= 67 ? '#ffc107' : '#28a745', // Rojo, Amarillo, Verde
                            '#e0e0e0' // Fondo gris
                        ],
                        borderWidth: 0, // Sin bordes queda más moderno
                        cutout: '80%' // Grosor del anillo
                    }]
                },
                options: {
                    responsive: true,
                    rotation: -90, // <--- En Chart.js v4 esto va acá en options
                    circumference: 180, // <--- En Chart.js v4 esto va acá en options
                    plugins: {
                        tooltip: { enabled: false }, 
                        legend: { display: false } 
                    }
                }
            });
        });
    </script>
</body>
</html>
