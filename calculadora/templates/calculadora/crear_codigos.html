{% load static %}

<h2>Crear códigos</h2>

<form method="post">
  {% csrf_token %}

  <select name="plan">
    {% for plan in planes %}
      <option value="{{ plan.id }}">{{ plan.nombre }}</option>
    {% endfor %}
  </select>

  <input name="prefijo" placeholder="INI / INT / PER">
  <input name="cantidad" type="number">
  <input name="max_uses" type="number" value="1">

  <button type="submit">Crear</button>
</form>
