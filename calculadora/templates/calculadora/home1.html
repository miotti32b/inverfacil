{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel</title>
    <link rel="stylesheet" href="{% static 'css/carrusel.css' %}">
</head>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <div class="carousel-item active">
                <a href="{% url 'carrera_rata' %}">
                    <img src="{% static 'img/rata.jpg' %}" alt="Carrera de la Rata">
                </a>
            </div>
            <div class="carousel-item">
                <a href="{% url 'calculadora' %}">
                    <img src="{% static 'img/calculadora.jpg' %}" alt="Calculadora">
                </a>
            </div>
            <div class="carousel-item">
                <a href="{% url 'inversiones' %}">
                    <img src="{% static 'img/inversion.jpg' %}" alt="Inversiones">
                </a>
            </div>
        </div>
    </div>

    <script src="{% static 'js/carrusel.js' %}"></script>
</body>
</html>
