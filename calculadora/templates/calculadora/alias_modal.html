<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configurar Alias</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #0072ff; color: white; padding: 40px; }
        .alias-box { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; }
        button { background: #ffa500; cursor: pointer; }
    </style>
</head>
<body>
    <div class="alias-box">
        <h2>Elegí tu Alias</h2>
        {% if error %}<p style="color: red;">{{ error }}</p>{% endif %}
        <form method="post">{% csrf_token %}
            <input type="text" name="alias" placeholder="Tu alias aquí" maxlength="30" required><br>
            <button type="submit">Guardar y comenzar</button>
        </form>
    </div>
</body>
</html>
