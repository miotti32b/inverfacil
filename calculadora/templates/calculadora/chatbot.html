<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mentor IA - InvertirEsFácil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-dark: #0f172a;
      --brand-green: #22c55e;
      --bg-app: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg-app); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .chat-container {
      width: 100%; max-width: 500px; background: var(--card-bg); height: 85vh;
      border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: flex; flex-direction: column; overflow: hidden;
    }
    
    .chat-header {
      background: var(--brand-dark); color: white; padding: 1.5rem;
      display: flex; align-items: center; gap: 15px;
    }
    .chat-header h2 { margin: 0; font-size: 1.2rem; }
    .chat-header p { margin: 0; font-size: 0.85rem; color: #94a3b8; }
    
    .chat-box {
      flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;
      background: #f1f5f9;
    }
    
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; }
    .msg.bot { background: white; color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
    .msg.user { background: var(--brand-green); color: var(--brand-dark); font-weight: 500; align-self: flex-end; border-bottom-right-radius: 4px; }
    
    .chat-input {
      padding: 1rem; background: white; display: flex; gap: 10px; border-top: 1px solid #e2e8f0;
    }
    .chat-input input {
      flex: 1; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 12px; font-family: 'Inter'; outline: none;
    }
    .chat-input button {
      background: var(--brand-dark); color: white; border: none; padding: 0 20px; border-radius: 12px; cursor: pointer; font-weight: 600;
    }
    
    /* Loader de los 3 puntitos */
    .typing { font-style: italic; color: #64748b; font-size: 0.85rem; align-self: flex-start; display: none; margin-left: 10px; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div style="font-size: 2.5rem;">🤵🏻‍♂️</div>
      <div>
        <h2>El Oráculo</h2>
        <p>Entrenado por 
            Emiliano Miotti AP 2264
        </p>
      </div>
      <a href="{% url 'home' %}" style="margin-left:auto; color:white; text-decoration:none; font-size:1.5rem;">×</a>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="msg bot">¿Qué hacés acá? El tiempo es plata. Decime rápido en qué andás tirando tus ahorros así te arreglo la vida.</div>
    </div>
    <div class="typing" id="typing">El Oráculo está escribiendo...</div>

    <form class="chat-input" id="chat-form">
      <input type="text" id="user-input" placeholder="Preguntale de inversiones..." autocomplete="off" required>
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script>
    const chatForm = document.getElementById('chat-form');
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const typing = document.getElementById('typing');

    // Para Django necesitamos mandar el token CSRF por POST
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      // 1. Mostrar mensaje del usuario
      chatBox.innerHTML += `<div class="msg user">${text}</div>`;
      userInput.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // 2. Mostrar "Escribiendo..."
      typing.style.display = 'block';

      // 3. Mandar a Python/OpenAI
      try {
        const response = await fetch('{% url "chatbot" %}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken
          },
          body: JSON.stringify({ message: text })
        });
        
        const data = await response.json();
        
        // 4. Ocultar escribiendo y mostrar respuesta
        typing.style.display = 'none';
        chatBox.innerHTML += `<div class="msg bot">${data.reply}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

      } catch (error) {
        typing.style.display = 'none';
        chatBox.innerHTML += `<div class="msg bot" style="color:red;">Error de conexión.</div>`;
      }
    });
  </script>
</body>
</html>
