{% load socialaccount %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar al Quiz Diario</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; }
        .login-container { max-width: 400px; margin: 100px auto; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 10px; }
        .btn-google { padding: 15px; background: white; color: #555; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Ingresá al Quiz Diario</h2>
        <p>Para jugar, ingresá con tu cuenta de Google:</p>
        {% providers_media_js %}
        {% for provider in socialaccount_providers %}
            {% if provider.id == "google" %}
                <a href="{% provider_login_url provider.id %}">
                    <button class="btn-google">Iniciar sesión con Google</button>
                </a>
            {% endif %}
        {% endfor %}
    </div>
    <a href="{% provider_login_url 'google' %}" class="btn btn-danger w-100 d-flex align-items-center justify-content-center p-2">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" width="20" class="me-2"/>
        Iniciar sesión con Google
    </a>
</body>
</html>
