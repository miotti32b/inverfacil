{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingresar · InvertirEsFácil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #0a0f1e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      color: #f1f5f9;
    }
    .card {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: #22c55e;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }
    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 0.4rem;
    }
    .sub {
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 0.9rem;
      background: #fff;
      color: #1e293b;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn-google:hover {
      background: #f1f5f9;
      box-shadow: 0 4px 15px rgba(255,255,255,0.1);
    }
    .btn-google img {
      width: 20px;
      height: 20px;
    }
    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #475569;
    }
    .footer-note a {
      color: #22c55e;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">IEF</div>
    <h2>Bienvenido</h2>
    <p class="sub">Usá tu cuenta de Google para acceder</p>

    <a href="{% provider_login_url 'google' process='login' next=request.GET.next %}" class="btn-google">
      <img src="https://www.google.com/favicon.ico" alt="Google">
      Continuar con Google
    </a>

    <p class="footer-note">
      Al ingresar aceptás nuestros <a href="/">términos</a>.<br>
      <a href="/">← Volver al inicio</a>
    </p>
  </div>
</body>
</html>
