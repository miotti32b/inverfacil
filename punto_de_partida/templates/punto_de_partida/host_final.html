{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Punto de Partida — Resultado final</title>
    <link rel="stylesheet" href="{% static 'punto_de_partida/css/juego.css' %}">
</head>
<body class="pdp-body">
    <div class="pdp-contenedor pdp-contenedor--ancho"
         id="pdp-root"
         data-urls='{"estado": "{% url "punto_de_partida:host_estado" codigo=partida.codigo %}"}'>
        <h1 class="pdp-titulo">¡Partida terminada!</h1>
        <p class="pdp-subtitulo">Capital final de cada participante — ese fue su camino desde el punto de partida.</p>

        <div class="pdp-card">
            <canvas id="pdp-grafico" style="width:100%; height:260px; display:block;"></canvas>
        </div>

        <div class="pdp-card">
            <p class="pdp-subtitulo">Podio</p>
            <ul class="pdp-leaderboard" id="pdp-podio-lista"></ul>
        </div>
    </div>

    <script src="{% static 'punto_de_partida/js/host.js' %}"></script>
    <script>pdpInitHostFinal(document.getElementById("pdp-root"));</script>
</body>
</html>
