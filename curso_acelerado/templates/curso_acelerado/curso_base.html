<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Curso acelerado | InvertirEsFacil{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #101820;
      --ink: #17211b;
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.11);
      --line: #e5e7eb;
      --muted: #64748b;
      --bg: #f7faf8;
      --card: #ffffff;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(34,197,94,0.08), transparent 32%),
        linear-gradient(220deg, rgba(15,23,42,0.07), transparent 36%),
        var(--bg);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
    }
    a { color: inherit; }
    .shell { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 18px 0 38px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--dark);
      font-weight: 800;
      text-decoration: none;
    }
    .mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--dark);
      color: var(--green);
      font-family: "Syne", sans-serif;
    }
    .nav-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--dark);
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    .btn.primary { background: var(--green); border-color: var(--green); color: #062417; }
    .btn.dark { background: var(--dark); border-color: var(--dark); color: #fff; }
    .btn.ghost { background: transparent; }
    .hero {
      display: grid;
      gap: 14px;
      padding: 22px 0 16px;
    }
    .eyebrow {
      width: fit-content;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--green-soft);
      color: #15803d;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h1, h2, h3 { font-family: "Syne", sans-serif; letter-spacing: 0; }
    h1 { margin: 0; font-size: clamp(2rem, 9vw, 4.6rem); line-height: 0.96; }
    p { line-height: 1.55; }
    .lead { margin: 0; max-width: 760px; color: var(--muted); font-size: 1.04rem; }
    .progress-wrap {
      margin: 18px 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.78);
    }
    .progress-meta { display: flex; justify-content: space-between; gap: 12px; font-weight: 800; margin-bottom: 9px; }
    .progress-bar { height: 12px; overflow: hidden; border-radius: 999px; background: #e2e8f0; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green), #111827); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 12px 28px rgba(15,23,42,0.06);
    }
    .status {
      width: fit-content;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 900;
      text-transform: uppercase;
    }
    .status.disponible { background: var(--green-soft); color: #15803d; }
    .status.completado { background: #111827; color: #fff; }
    .status.bloqueado { background: #f1f5f9; color: #64748b; }
    .muted { color: var(--muted); }
    .muted.small { font-size: 0.78rem; }
    .content-box {
      white-space: pre-line;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      line-height: 1.7;
    }
    .key-points ul { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 6px; }
    .key-points li { line-height: 1.5; }

    /* Mapa horizontal de niveles (reemplaza el camino vertical) */
    .map {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      gap: 22px 16px;
      padding: 12px 0 24px;
    }
    .map-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 128px;
    }
    .map-column:nth-child(even) { margin-top: 46px; }
    .tier-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-align: center;
      padding: 8px 10px;
      border-radius: 12px;
      width: 100%;
    }
    .tier-chip .tier-icon { font-size: 1.5rem; line-height: 1; }
    .tier-chip .tier-nombre { font-size: 0.78rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; }
    .node-stack { display: flex; flex-direction: column; align-items: center; }
    .node-unit { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .node-connector { width: 4px; height: 14px; background: var(--line); border-radius: 999px; }
    .node {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      text-decoration: none;
      font-weight: 900;
      border: 4px solid var(--line);
      background: #fff;
      color: var(--dark);
      box-shadow: 0 8px 0 rgba(15, 23, 42, 0.08);
    }
    .node-icon { font-size: 1.4rem; line-height: 1; }
    .node-label { font-size: 0.62rem; letter-spacing: 0.04em; }
    .node.disponible {
      border-color: var(--green);
      background: var(--green-soft);
      color: #15803d;
      animation: node-pulse 1.8s ease-in-out infinite;
    }
    .node.completado { border-color: var(--dark); background: var(--dark); color: #fff; }
    .node.locked { border-color: var(--line); background: #f1f5f9; color: #94a3b8; opacity: 0.5; cursor: not-allowed; }
    @keyframes node-pulse {
      0%, 100% { box-shadow: 0 8px 0 rgba(15, 23, 42, 0.08), 0 0 0 0 rgba(34, 197, 94, 0.35); }
      50% { box-shadow: 0 8px 0 rgba(15, 23, 42, 0.08), 0 0 0 10px rgba(34, 197, 94, 0); }
    }
    .node-caption { font-size: 0.72rem; text-align: center; line-height: 1.3; min-height: 2.6em; }
    @media (max-width: 640px) {
      .map { gap: 18px 10px; }
      .map-column { width: 100px; }
      .map-column:nth-child(even) { margin-top: 26px; }
      .node { width: 62px; height: 62px; }
    }

    /* Pasos (diagnostico / contenido / evaluacion) */
    .steps-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
    .step-dot {
      padding: 6px 12px;
      border-radius: 999px;
      background: #eef2f0;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.78rem;
    }
    .step-dot.active { background: var(--dark); color: #fff; }

    /* Preguntas de diagnostico (no bloqueantes) */
    .diag-option { text-align: left; background: #fff; font: inherit; }
    .diag-option.correct { border-color: var(--green); background: var(--green-soft); color: #15803d; }
    .diag-option.incorrect { border-color: #ef4444; background: rgba(239, 68, 68, 0.08); color: #b91c1c; }
    .diag-question.answered .diag-option { cursor: default; pointer-events: none; }
    .diag-question.answered .diag-option:not(.correct):not(.incorrect) { opacity: 0.5; }
    .diag-feedback { margin-top: 8px; font-weight: 700; }

    /* Infografias por modulo */
    .infografia h3 { margin: 0 0 12px; font-size: 1.15rem; }
    .infog-comparacion {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: stretch;
    }
    .infog-columna {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      border-radius: var(--radius);
    }
    .infog-columna-izq { background: linear-gradient(180deg, rgba(14,165,233,0.14), rgba(14,165,233,0.03)); }
    .infog-columna-der { background: linear-gradient(180deg, rgba(34,197,94,0.16), rgba(34,197,94,0.03)); }
    .infog-columna-titulo { font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.1rem; }
    .infog-columna-nota { font-size: 0.78rem; color: var(--muted); margin-top: -6px; }
    .infog-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: rgba(255,255,255,0.7); border-radius: 10px; }
    .infog-divisor { display: flex; align-items: center; justify-content: center; font-size: 1.4rem; opacity: 0.6; }
    .infog-icon { font-size: 1.3rem; line-height: 1; }
    .infog-dona-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
    .infog-dona {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .infog-dona-centro {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-family: "Syne", sans-serif;
    }
    .infog-leyenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .infog-leyenda li { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .infog-chip { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
    .infog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .infog-tile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-weight: 700;
    }
    .infog-flujo { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .infog-flujo-paso {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      min-width: 108px;
      text-align: center;
      font-weight: 700;
    }
    .infog-flujo-flecha { font-size: 1.2rem; color: var(--muted); }
    .infog-embudo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .infog-embudo-paso {
      padding: 12px;
      border-radius: 10px;
      color: #fff;
      font-weight: 800;
      text-align: center;
    }

    .image-grid { display: grid; gap: 12px; }
    .image-card img { width: 100%; display: block; border-radius: 12px; border: 1px solid var(--line); }
    .question { padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px;
      margin-top: 9px;
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
    }
    .option:hover { border-color: var(--green); background: var(--green-soft); }
    .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    @media (min-width: 780px) {
      .grid.modules { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .image-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .infog-comparacion { grid-template-columns: 1fr; }
      .infog-divisor { transform: rotate(90deg); padding: 4px 0; }
      .infog-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="{% url 'perfil_usuario' %}">
        <span class="mark">IEF</span>
        <span>InvertirEsFacil</span>
      </a>
      <nav class="nav-actions">
        <a class="btn ghost" href="{% url 'perfil_usuario' %}">Mi panel</a>
        <a class="btn ghost" href="{% url 'curso_acelerado:landing' %}">Curso</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
