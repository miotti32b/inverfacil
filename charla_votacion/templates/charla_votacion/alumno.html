<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votá | {{ sesion.nombre }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #101820; --green: #22c55e; --green-soft: rgba(34,197,94,0.12);
      --bg: #f7faf8; --card: #ffffff; --muted: #64748b; --line: #e5e7eb; --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); font-family: 'DM Sans', sans-serif;
      color: var(--dark); padding: 20px; display: flex; justify-content: center;
    }
    .wrap { max-width: 420px; width: 100%; }
    h1 { font-family: 'Syne', sans-serif; font-size: 1.4rem; margin: 8px 0 2px; }
    p.desc { color: var(--muted); margin: 0 0 20px; }
    .opcion {
      background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
      padding: 18px; margin-bottom: 12px; cursor: pointer; font-weight: 700; font-size: 1.05rem;
      transition: all .15s;
    }
    .opcion:active { transform: scale(0.98); }
    .opcion.elegida { border-color: var(--green); background: var(--green-soft); }
    .opcion .d { font-weight: 500; color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .estado { text-align: center; padding: 40px 12px; color: var(--muted); font-weight: 600; }
    .oculto { display: none; }
    .aviso-voto { text-align: center; color: var(--green); font-weight: 700; font-size: 0.9rem; margin: -8px 0 16px; }
    .interesado { margin-top: 24px; text-align: left; }
    .interesado input, .interesado textarea {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
      font-family: inherit; font-size: 0.95rem; margin-bottom: 10px;
    }
    .interesado input:focus, .interesado textarea:focus { outline: none; border-color: var(--green); }
    .interesado button {
      width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--green);
      color: white; font-weight: 800; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>
{% csrf_token %}
<div class="wrap">
  <div id="votando">
    <h1 id="titulo-etapa">Esperando...</h1>
    <p class="desc" id="desc-etapa"></p>
    <p class="aviso-voto oculto" id="aviso-voto">✅ Voto registrado. Podés cambiarlo hasta que cierre la etapa.</p>
    <div id="opciones"></div>
  </div>
  <div id="cerrada" class="estado oculto"></div>
  <div id="terminado" class="estado oculto">
    <p>🎉 ¡Definieron el modelo de negocio! Ahora se está construyendo la startup en vivo. Mirá la pantalla.</p>
    <div class="interesado" id="interesado-form">
      <p style="text-align:center; font-weight:700; color:var(--dark);">¿Te interesa seguir con este proyecto después de la charla?</p>
      <input type="text" id="interesado-nombre" placeholder="Tu nombre (opcional)">
      <input type="text" id="interesado-contacto" placeholder="Mail o WhatsApp" required>
      <textarea id="interesado-comentario" placeholder="Comentario (opcional)" rows="2"></textarea>
      <button type="button" onclick="enviarInteresado()">Quiero seguir con esto</button>
    </div>
    <p class="aviso-voto oculto" id="interesado-gracias">🙌 ¡Gracias! Te vamos a contactar.</p>
  </div>
</div>

<script>
function getDispositivoId() {
  let id = localStorage.getItem('cv_dispositivo_id');
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem('cv_dispositivo_id', id);
  }
  return id;
}

function getCookie(name) {
  const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return match ? match.pop() : '';
}

const codigo = "{{ sesion.codigo }}";
const dispositivoId = getDispositivoId();
const votosHechos = JSON.parse(localStorage.getItem('cv_votos_' + codigo) || '{}');

fetch(`/votacion/api/presente/${codigo}/`, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
  body: JSON.stringify({ dispositivo_id: dispositivoId }),
}).catch(() => {});

function marcarVotado(etapaId, opcionId) {
  votosHechos[etapaId] = opcionId;
  localStorage.setItem('cv_votos_' + codigo, JSON.stringify(votosHechos));
}

async function votar(etapaId, opcionId) {
  marcarVotado(etapaId, opcionId);
  actualizar();
  try {
    await fetch(`/votacion/api/votar/${codigo}/`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken'),
      },
      body: JSON.stringify({ opcion_id: opcionId, dispositivo_id: dispositivoId }),
    });
  } catch (e) {}
}

async function enviarInteresado() {
  const contacto = document.getElementById('interesado-contacto').value.trim();
  if (!contacto) return;
  try {
    await fetch(`/votacion/api/interesado/${codigo}/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
      body: JSON.stringify({
        nombre: document.getElementById('interesado-nombre').value.trim(),
        contacto,
        comentario: document.getElementById('interesado-comentario').value.trim(),
      }),
    });
    document.getElementById('interesado-form').classList.add('oculto');
    document.getElementById('interesado-gracias').classList.remove('oculto');
  } catch (e) {}
}

let ultimaEtapaId = null;

async function actualizar() {
  const res = await fetch(`/votacion/api/estado/${codigo}/`);
  const data = await res.json();

  const votando = document.getElementById('votando');
  const cerrada = document.getElementById('cerrada');
  const terminado = document.getElementById('terminado');
  const aviso = document.getElementById('aviso-voto');

  if (data.terminada) {
    votando.classList.add('oculto');
    cerrada.classList.add('oculto');
    terminado.classList.remove('oculto');
    return;
  }

  const etapa = data.etapa;
  if (!etapa) return;
  ultimaEtapaId = etapa.id;

  const yaVoto = votosHechos[etapa.id];

  document.getElementById('titulo-etapa').textContent = etapa.titulo;
  document.getElementById('desc-etapa').textContent = etapa.descripcion;

  if (etapa.cerrada) {
    const ganadora = etapa.opciones.find(o => o.id === etapa.ganadora_id);
    cerrada.textContent = ganadora
      ? `🏆 Ganó: ${ganadora.texto}. Preparando la próxima etapa…`
      : 'Votación cerrada. Preparando la próxima etapa…';
    votando.classList.add('oculto');
    cerrada.classList.remove('oculto');
    terminado.classList.add('oculto');
    return;
  }

  const cont = document.getElementById('opciones');
  cont.innerHTML = '';
  etapa.opciones.forEach(op => {
    const div = document.createElement('div');
    div.className = 'opcion' + (yaVoto === op.id ? ' elegida' : '');
    div.innerHTML = `${op.texto}` + (op.descripcion ? `<div class="d">${op.descripcion}</div>` : '');
    div.onclick = () => votar(etapa.id, op.id);
    cont.appendChild(div);
  });

  aviso.classList.toggle('oculto', !yaVoto);
  votando.classList.remove('oculto');
  cerrada.classList.add('oculto');
  terminado.classList.add('oculto');
}

actualizar();
setInterval(actualizar, 1500);
</script>
</body>
</html>
